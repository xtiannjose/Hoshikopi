# Weekly update pull requests; the owner merges them like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (inside eslint-config-next) does not run on TS 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types follow the Node version the app runs on (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
